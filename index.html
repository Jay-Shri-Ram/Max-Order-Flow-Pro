      @media print {
        body * {
          visibility: hidden !important;
        }
        #printable-invoice-area,
        #printable-invoice-area * {
          visibility: visible !important;
        }
        #printable-invoice-area {
          position: absolute !important;
          left: 0 !important;
          top: 0 !important;
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          background: white !important;
          color: black !important;
        }
        .no-print {
          display: none !important;
        }
      }
    </style>
